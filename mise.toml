[tools]
go = "1.26.5"
rust = "latest"

[tasks.dev]
description = "Run the translation script with default requirements prompt"
run = "go run ./cmd/recode"

[tasks.build]
description = "Build binary"
run = "go build -o bin/recode ./cmd/recode"

[tasks.test]
description = "Run tests"
run = "go test ./..."

[tasks.lint]
description = "Run go vet"
run = "go vet ./..."

[tasks.fmt]
description = "Format Go code"
run = "go fmt ./..."

[tasks.clean]
description = "Clean build artifacts"
run = "rm -rf bin/ .artifacts/"
