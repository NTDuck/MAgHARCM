[tools]
go = "1.26.5"

[tasks.build]
run = "go build -o bin/MAgHARCM ./cmd/MAgHARCM"

[tasks.start]
run = "go run ./cmd/MAgHARCM"

[tasks.test]
run = "go test ./..."

[tasks.fmt]
run = "go fmt ./..."

[tasks.lint]
run = "go vet ./..."

[tasks.clean]
run = '''
mkdir -p experiments/0001-SA-DeepAgent-MinimalTools/artifacts/GildedRose-Refactoring-Kata/rust
rm -rf experiments/*/artifacts/GildedRose-Refactoring-Kata/rust/* experiments/*/artifacts/GildedRose-Refactoring-Kata/rust/.[!.]* experiments/*/artifacts/GildedRose-Refactoring-Kata/rust/..?* 2>/dev/null || true
touch experiments/0001-SA-DeepAgent-MinimalTools/artifacts/GildedRose-Refactoring-Kata/rust/.gitkeep
'''
