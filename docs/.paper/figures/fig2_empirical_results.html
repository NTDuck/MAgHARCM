    <!-- Cause 1 -->

    <text x="35" y="73" font-size="11.5" fill="#64748b">C/Go mutable pointer aliasing violates Rust borrow checker (E0382, E0502)</text>

    <!-- Cause 2 -->
    <text x="20" y="98" font-size="13" font-weight="600" fill="#1e293b">2. Cyclic Package Dependencies</text>
    <rect x="230" y="87" width="220" height="13" rx="3" fill="#fed7aa" />
    <rect x="230" y="87" width="57" height="13" rx="3" fill="#ea580c" />
    <text x="460" y="98" font-size="12" font-weight="700" fill="#9a3412">26.0% (23)</text>

    <!-- Cause 3 -->
