    <!-- Cause 1: Borrow Checker -->
    <text x="20" y="58" font-size="13" font-weight="700" fill="#1e293b">1. Borrow Checker &amp; Lifetime Aliasing</text>

    <!-- Cause 3: Foreign Runtime Semantics -->
