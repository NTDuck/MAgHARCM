<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>

    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      background: #ffffff;
      font-family: 'Crimson Pro', 'Times New Roman', Times, serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    svg {
      background: #ffffff;
    }
    text {
      font-family: 'Crimson Pro', 'Times New Roman', Times, serif;
    }
    .mono {
      font-family: 'JetBrains Mono', monospace;
    }
  </style>
</head>
<body>
<svg width="1100" height="420" viewBox="0 0 1100 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>
  
  <rect x="10" y="10" width="1080" height="400" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />

    <text x="140" y="54" font-size="11" font-weight="700" fill="#0f172a">Pair</text>
    <text x="220" y="54" font-size="11" font-weight="700" fill="#0f172a">Source LoC</text>
    <text x="310" y="54" font-size="11" font-weight="700" fill="#0f172a">Wall-Clock (s)</text>

    <text x="20" y="102" font-size="10" fill="#64748b">C Kata (4 files)</text>
    <text x="140" y="94" font-size="11" fill="#334155">C $\to$ Rust</text>
    <text x="220" y="94" font-size="11" fill="#334155">199</text>
    <text x="310" y="94" font-size="11" fill="#334155">450.1 s</text>
    <text x="410" y="94" font-size="11" font-weight="700" fill="#b45309">INCOMPLETE</text>

    <rect x="10" y="118" width="470" height="48" fill="#ffffff" />

    <text x="140" y="146" font-size="11" fill="#334155">Go $\to$ Rust</text>

    <text x="310" y="146" font-size="11" fill="#334155">900.0 s</text>
    <text x="410" y="146" font-size="11" font-weight="600" fill="#be123c">TIMEOUT</text>

    <rect x="10" y="170" width="470" height="48" fill="#f8fafc" />
    <text x="20" y="190" font-size="12" font-weight="600" fill="#1e293b">Stats</text>
    <text x="20" y="206" font-size="10" fill="#64748b">Go Math (65 files)</text>
    <text x="140" y="198" font-size="11" fill="#334155">Go $\to$ Rust</text>
    <text x="220" y="198" font-size="11" fill="#334155">5,625</text>
    <text x="310" y="198" font-size="11" fill="#334155">900.0 s</text>
    <text x="410" y="198" font-size="11" font-weight="600" fill="#be123c">TIMEOUT</text>

    <rect x="10" y="222" width="470" height="48" fill="#ffffff" />

    <text x="310" y="250" font-size="11" fill="#334155">900.0 s</text>
    <text x="410" y="250" font-size="11" font-weight="600" fill="#be123c">TIMEOUT</text>
    <text x="20" y="288" font-size="10" font-style="italic" fill="#64748b">* Execution on local SLM topology (Liquid MoE 8B + Qwen3-4B) under bounded inference budget.</text>
  </g>

  <!-- Panel B: Failure Root-Cause Breakdown -->
  <g transform="translate(555, 85)">
    <rect width="500" height="300" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1" filter="url(#shadow2)" />
    <rect width="500" height="28" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" />
    <text x="250" y="19" font-size="13" font-weight="700" text-anchor="middle" fill="#1e293b">Chart (b): Illustrative Failure Modes &amp; Taxonomy (Qualitative)</text>

    <!-- Category 1: Rust Borrow Checker & Lifetime -->
    <g transform="translate(20, 48)">
      <text x="0" y="14" font-size="12" font-weight="600" fill="#1e293b">Borrow Checker &amp; Lifetimes (E0382, E0502, E0597)</text>
      <rect x="0" y="22" width="460" height="18" rx="3" fill="#f1f5f9" />
      <rect x="0" y="22" width="460" height="18" rx="3" fill="#ef4444" />
      <text x="20" y="36" font-size="11" font-weight="700" fill="#ffffff">Mutable Aliasing &amp; Ownership Across Function Boundaries</text>
    </g>

    <!-- Category 2: Cyclic Dependencies & Module Visibility -->
    <g transform="translate(20, 106)">
      <text x="0" y="14" font-size="12" font-weight="600" fill="#1e293b">Cyclic Dependencies &amp; Module Visibility (E0432, E0603)</text>
      <rect x="0" y="22" width="460" height="18" rx="3" fill="#f1f5f9" />
      <rect x="0" y="22" width="460" height="18" rx="3" fill="#f97316" />
      <text x="20" y="36" font-size="11" font-weight="700" fill="#ffffff">Circular Imports Across Interconnected Modules</text>

    <g transform="translate(20, 164)">
      <text x="0" y="14" font-size="12" font-weight="600" fill="#1e293b">Foreign Runtime Semantics (Java/Go GC vs RAII)</text>
      <rect x="0" y="22" width="460" height="18" rx="3" fill="#f1f5f9" />
      <rect x="0" y="22" width="460" height="18" rx="3" fill="#eab308" />
      <text x="20" y="36" font-size="11" font-weight="700" fill="#ffffff">Reflection, Dynamic Loading &amp; Nil Semantics</text>
    </g>

    <!-- Category 4: Local SLM Context Saturation -->
    <g transform="translate(20, 222)">
      <text x="0" y="14" font-size="12" font-weight="600" fill="#1e293b">Inference Latency &amp; Context Budget Saturation</text>
      <rect x="0" y="22" width="460" height="18" rx="3" fill="#f1f5f9" />
      <rect x="0" y="22" width="460" height="18" rx="3" fill="#3b82f6" />
      <text x="20" y="36" font-size="11" font-weight="700" fill="#ffffff">Sequential Chunk Latency on Large Corpora</text>
    </g>
