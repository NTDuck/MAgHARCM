<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400;1,600&family=JetBrains+Mono:wght@400;500;600&display=swap');
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      background: #ffffff;
      font-family: 'Crimson Pro', 'Times New Roman', Times, Georgia, serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    svg {
      background: #ffffff;
    }
    text {
      font-family: 'Crimson Pro', 'Times New Roman', Times, Georgia, serif;
    }
    .mono {
      font-family: 'JetBrains Mono', monospace;
    }
  </style>
</head>
<body>
<svg width="1180" height="540" viewBox="0 0 1180 540" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow1" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3.5" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1d4ed8" />
    </marker>
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#6d28d9" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#047857" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#be123c" />
    </marker>
  </defs>

  <!-- Background Panel -->
  <rect x="10" y="10" width="1160" height="520" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  
  <!-- Title / Header -->
  <text x="590" y="42" font-size="21" font-weight="700" text-anchor="middle" fill="#0f172a">Figure 1: MAgHARCM Multi-Agent Repository Translation Architecture &amp; Orchestration Workflow</text>
  <text x="590" y="66" font-size="14" font-style="italic" text-anchor="middle" fill="#475569">Four-agent topological decomposition with bounded context assembly, multi-stage validation, and iterative compiler repair loops</text>

  <!-- Stage 1: Input Codebase -->
  <g transform="translate(30, 95)">
    <rect width="170" height="185" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6" filter="url(#shadow1)" />
    <rect width="170" height="32" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" />
    <text x="85" y="22" font-size="15" font-weight="700" text-anchor="middle" fill="#1e293b">Source Repository</text>
    <text x="16" y="58" font-size="13.5" fill="#334155">• Source AST (P<tspan font-size="10" dy="2">s</tspan><tspan font-size="13.5" dy="-2">)</tspan></text>
    <text x="16" y="82" font-size="13.5" fill="#334155">• Build Manifests</text>
    <text x="16" y="106" font-size="13.5" fill="#334155">• Test Suite (T<tspan font-size="10" dy="2">s</tspan><tspan font-size="13.5" dy="-2">)</tspan></text>
    <text x="16" y="130" font-size="13.5" fill="#334155">• Library Deps (D<tspan font-size="10" dy="2">s</tspan><tspan font-size="13.5" dy="-2">)</tspan></text>
    <rect x="16" y="148" width="138" height="22" rx="4" fill="#f1f5f9" stroke="#cbd5e1" />
    <text x="85" y="163" font-size="12" font-weight="600" text-anchor="middle" fill="#475569" class="mono">C / Go / Java</text>
  </g>

  <!-- Arrow 1 -> Analyzer -->
  <path d="M 200 187 L 240 187" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)" fill="none" />

  <!-- Stage 2: Analyzer Agent -->
  <g transform="translate(245, 95)">
    <rect width="195" height="185" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.8" filter="url(#shadow1)" />
    <rect width="195" height="32" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1" />
    <text x="97" y="22" font-size="15" font-weight="700" text-anchor="middle" fill="#1d4ed8">1. Analyzer Agent</text>
    <text x="14" y="58" font-size="13" fill="#1e293b">• Tree-Sitter Directory Walk</text>
    <text x="14" y="80" font-size="13" fill="#1e293b">• Müller Strategy Selection:</text>
    <text x="24" y="100" font-size="11.5" font-weight="600" fill="#1e40af" class="mono">DIRECT | INCR | PILOT</text>
    <text x="14" y="122" font-size="13" fill="#1e293b">• Cross-Library Resolution</text>
    <text x="14" y="144" font-size="13" fill="#1e293b">• Target Architecture Design</text>
    <rect x="12" y="154" width="171" height="20" rx="4" fill="#dbeafe" />
    <text x="97" y="168" font-size="11" font-weight="700" text-anchor="middle" fill="#1e40af">Qwen3 30B (Deep Reasoning)</text>
  </g>

  <!-- Arrow Analyzer -> Planning -->
  <path d="M 440 187 L 475 187" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrow-blue)" fill="none" />

  <!-- Stage 3: Planning Agent -->
  <g transform="translate(480, 95)">
    <rect width="195" height="185" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.8" filter="url(#shadow1)" />
    <rect width="195" height="32" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1" />
    <text x="97" y="22" font-size="15" font-weight="700" text-anchor="middle" fill="#6d28d9">2. Planning Agent</text>
    <text x="14" y="58" font-size="13" fill="#1e293b">• AST Fragment Extraction</text>
    <text x="14" y="80" font-size="13" fill="#1e293b">• Reverse-Topo Call DAG</text>
    <text x="24" y="100" font-size="12" font-style="italic" fill="#5b21b6">Back-Edge Cycle Break</text>
    <text x="14" y="122" font-size="13" fill="#1e293b">• Manifest Rewriter (D<tspan font-size="9" dy="2">s</tspan><tspan font-size="13" dy="-2"> → D</tspan><tspan font-size="9" dy="2">t</tspan><tspan font-size="13" dy="-2">)</tspan></text>
    <text x="14" y="144" font-size="13" fill="#1e293b">• Target Skeleton Crate</text>
    <rect x="12" y="154" width="171" height="20" rx="4" fill="#ede9fe" />
    <text x="97" y="168" font-size="11" font-weight="700" text-anchor="middle" fill="#5b21b6">Part A (Code) &amp; Part B (Tests)</text>
  </g>

  <!-- Arrow Planning -> Translator -->
  <path d="M 675 187 L 710 187" stroke="#6d28d9" stroke-width="2" marker-end="url(#arrow-indigo)" fill="none" />

  <!-- Stage 4: Translator Agent -->
  <g transform="translate(715, 95)">
    <rect width="195" height="185" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.8" filter="url(#shadow1)" />
    <rect width="195" height="32" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1" />
    <text x="97" y="22" font-size="15" font-weight="700" text-anchor="middle" fill="#047857">3. Translator Agent</text>
    <text x="14" y="58" font-size="13" fill="#1e293b">• Chunked Code Generation</text>
    <text x="14" y="80" font-size="13" fill="#1e293b">• Symbol Navigator (≤ 4 KB)</text>
    <text x="14" y="102" font-size="13" fill="#1e293b">• Prior Memory Digest (≤ 4 KB)</text>
    <text x="14" y="124" font-size="13" fill="#1e293b">• Part B Test Synthesis</text>
    <text x="14" y="144" font-size="13" fill="#1e293b">• State Disk Sync &amp; Checkpoint</text>
    <rect x="12" y="154" width="171" height="20" rx="4" fill="#d1fae5" />
    <text x="97" y="168" font-size="11" font-weight="700" text-anchor="middle" fill="#065f46">Qwen3-4B (Target Coding SLM)</text>
  </g>

  <!-- Arrow Translator -> Validator -->
  <path d="M 910 187 L 945 187" stroke="#047857" stroke-width="2" marker-end="url(#arrow-emerald)" fill="none" />

  <!-- Stage 5: Validator Agent -->
  <g transform="translate(950, 95)">
    <rect width="195" height="185" rx="8" fill="#ffffff" stroke="#e11d48" stroke-width="1.8" filter="url(#shadow1)" />
    <rect width="195" height="32" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="1" />
    <text x="97" y="22" font-size="15" font-weight="700" text-anchor="middle" fill="#be123c">4. Validator Agent</text>
    <text x="14" y="58" font-size="12.5" fill="#1e293b">1. Pre-AST Syntax Validation</text>
    <text x="14" y="78" font-size="12.5" fill="#1e293b">2. Cargo Build Diagnostics</text>
    <text x="14" y="98" font-size="12.5" fill="#1e293b">3. Native Test Execution</text>
    <text x="14" y="118" font-size="12.5" fill="#1e293b">4. Adversarial Weakening Guard</text>
    <text x="14" y="138" font-size="12.5" fill="#1e293b">5. Coverage Plateau Detector</text>
    <rect x="12" y="154" width="171" height="20" rx="4" fill="#ffe4e6" />
    <text x="97" y="168" font-size="11" font-weight="700" text-anchor="middle" fill="#9f1239">5-Stage Validation Cascade</text>
  </g>

  <!-- Repair Loop (Feedback Arc) -->
  <path d="M 1047 280 L 1047 360 L 812 360 L 812 285" stroke="#be123c" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-rose)" fill="none" />
  <rect x="850" y="344" width="160" height="30" rx="6" fill="#ffffff" stroke="#be123c" stroke-width="1.5" filter="url(#shadow1)" />
  <text x="930" y="364" font-size="13" font-weight="700" text-anchor="middle" fill="#be123c">Repair Mode (Iter ≤ K)</text>

  <!-- Checkpoints & Persistence Box -->
  <g transform="translate(30, 310)">
    <rect width="640" height="190" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.6" filter="url(#shadow1)" />
    <rect width="640" height="30" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1" />
    <text x="320" y="21" font-size="14.5" font-weight="700" text-anchor="middle" fill="#92400e">State Persistence, Checkpointing &amp; Verification Defense Invariants</text>
    
    <text x="16" y="56" font-size="13" fill="#1e293b">• <tspan font-weight="700">Atomic State Checkpointing:</tspan> Serialized under <tspan class="mono" font-size="12">.artifacts/&lt;run-id&gt;/checkpoints/iter-*.json</tspan></text>
    <text x="16" y="80" font-size="13" fill="#1e293b">• <tspan font-weight="700">CodaMOSA Coverage Plateau Detector:</tspan> Halts unproductive repair loops when coverage stales</text>
    <text x="16" y="104" font-size="13" fill="#1e293b">• <tspan font-weight="700">Adversarial Weakening Guard:</tspan> Enforces AssertCount(T<tspan font-size="9" dy="2">t</tspan><tspan font-size="13" dy="-2">) ≥ AssertCount(T</tspan><tspan font-size="9" dy="2">s</tspan><tspan font-size="13" dy="-2">); rejects assertion deletion</tspan></text>
    <text x="16" y="128" font-size="13" fill="#1e293b">• <tspan font-weight="700">Bounded Context Assembly:</tspan> Caps prompt slices (≤ 4 KB Symbol Navigator + ≤ 4 KB Prior Memory)</text>
    <text x="16" y="152" font-size="13" fill="#1e293b">• <tspan font-weight="700">Reasoning &amp; Coding Topology:</tspan> Qwen3 30B Thinking Model (Planning) + Qwen3 4B (Exact Rust Synthesis)</text>
  </g>

  <!-- Output Box (Success Exit) -->
  <g transform="translate(715, 395)">
    <rect width="430" height="105" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#shadow1)" />
    <text x="215" y="26" font-size="15" font-weight="700" text-anchor="middle" fill="#15803d">Target Verified Rust Project (P<tspan font-size="10" dy="2">t</tspan><tspan font-size="15" dy="-2">)</tspan></text>
    <text x="24" y="52" font-size="13" fill="#166534">✓ Clean compilation under native Cargo toolchain without warnings</text>
    <text x="24" y="72" font-size="13" fill="#166534">✓ 100% test pass rate on target assertions (RealTests ≥ MinRealTests)</text>
    <text x="24" y="92" font-size="13" fill="#166534">✓ Strictly preserved observational semantics and assertion integrity</text>
  </g>

  <!-- Arrow Validator -> Success Exit -->
  <path d="M 1047 280 L 1047 390" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrow-emerald)" fill="none" />
  <rect x="1010" y="325" width="74" height="22" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1.2" />
  <text x="1047" y="340" font-size="11.5" font-weight="700" text-anchor="middle" fill="#16a34a">Converged</text>
</svg>
</body>
</html>
